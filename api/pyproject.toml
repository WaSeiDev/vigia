[project]
name = "api"
version = "0.1.0"
description = "Financial project with bot"
authors = [{ name = "Walther Seidel M.", email = "waseidev@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]",
    "psycopg[binary]>=3.3.9",
    "sqlalchemy>=2.1.9",
]

[project.scripts]
api = "api:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"


[tool.alembic]
script_location = "%(here)s/alembic"
prepend_sys_path = ["."]
